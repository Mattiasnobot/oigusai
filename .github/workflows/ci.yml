name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  HYBRID_RETRIEVAL_ENABLED: "false"
  RERANKER_ENABLED: "false"
  ALLOW_LIVE_RT_FALLBACK: "false"
  ALLOW_MOCK_ANALYSIS: "false"
  APP_RELOAD: "false"
  OLLAMA_PRELOAD_ENABLED: "false"
  LOG_LEVEL: "WARNING"

jobs:
  tests:
    name: Unit and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install CPU-only CI dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-ci.txt
      - name: Compile Python sources
        run: python -m compileall -q main.py config.py services verifiers scripts tests
      - name: Run unittest suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

  quality-gate:
    name: Corpus and deterministic workflow gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install CPU-only CI dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-ci.txt
      - name: Validate config, corpus and evaluation assets
        run: python scripts/ci_quality_gate.py
      - name: Verify audited V6.1 184/200 retrieval baseline
        run: python scripts/verify_retrieval_baseline.py
      - name: Run deterministic 200-case lexical workflow evaluation
        run: |
          mkdir -p artifacts
          # GitHub-hosted CI deliberately keeps the optional local ML/vector stack disabled.
          # The audited V6.1 184/200 baseline is provenance-locked by the step above;
          # this executable CPU-only smoke gate retains the frozen V5 lexical 174/200 floor.
          python scripts/evaluate_workflow.py --retrieval-floor 174 --json-output artifacts/workflow-report.json
      - name: Upload workflow report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workflow-quality-report
          path: artifacts/workflow-report.json
          if-no-files-found: ignore
          retention-days: 14
